<script>
        // Simple particle system for floating hearts/sparkles
        function createParticles() {
            const container = document.getElementById('particle-container');
            const icons = ['favorite', 'sparkles', 'magic_button', 'heart_plus'];
            const count = 15;

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('span');
                heart.className = 'material-symbols-outlined floating-heart';
                heart.innerText = icons[Math.floor(Math.random() * icons.length)];
                
                const size = Math.random() * (32 - 16) + 16;
                const left = Math.random() * 100;
                const delay = Math.random() * 6;
                const duration = Math.random() * (10 - 6) + 6;

                heart.style.fontSize = `${size}px`;
                heart.style.left = `${left}%`;
                heart.style.animationDelay = `${delay}s`;
                heart.style.animationDuration = `${duration}s`;
                
                if (Math.random() > 0.5) {
                    heart.style.fontVariationSettings = "'FILL' 1";
                }

                container.appendChild(heart);
            }
        }

        function handleOpen() {
            const envelope = document.querySelector('.envelope');
            envelope.style.transform = 'scale(1.2) translateY(-20px) rotateX(10deg)';
            envelope.style.opacity = '0';
            envelope.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
            
            setTimeout(() => {
                alert("The letter is unfolding... Prepare your heart!");
                // Here you would navigate or trigger the next step of the UI journey
                location.reload(); // Just reset for demo purposes
            }, 800);
        }

        window.onload = createParticles;
    </script>
