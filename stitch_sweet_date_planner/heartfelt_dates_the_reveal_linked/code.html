      }
    }catch(_e){}</script></head><body class="bg-surface text-on-surface overflow-hidden">
<!-- Immersive Background Canvas -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center gradient-mesh px-margin-mobile md:px-margin-desktop overflow-hidden">
<!-- Sparkle Accents Overlay -->
<div class="absolute inset-0 z-0" id="sparkle-container"></div>
<!-- Content Canvas -->
<div class="relative z-10 max-w-container-max w-full flex flex-col items-center text-center">
<!-- Elegant Serif Quote -->
<div class="reveal-delay-1 mb-12">
<h1 class="font-accent-text italic text-display-lg-mobile md:text-display-lg text-primary max-w-3xl leading-snug">
                    “Every moment with you is a gift I promise to cherish.”
                </h1>
<!-- Decorative Squiggle -->
<div class="mt-6 flex justify-center">
<svg class="text-tertiary-container opacity-60" fill="none" height="20" viewbox="0 0 120 20" width="120" xmlns="http://www.w3.org/2000/svg">
<path d="M2 18C20 2 40 18 60 2C80 18 100 2 118 18" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
</svg>
</div>
</div>
<!-- Pulsating CTA Button -->
<div class="reveal-delay-2">
<button class="group relative inline-flex items-center gap-2 px-10 py-5 bg-gradient-to-r from-primary to-tertiary-container text-on-primary rounded-full font-headline-md text-body-lg shadow-[0px_10px_30px_rgba(185,7,96,0.3)] hover:scale-105 transition-all duration-500 animate-[pulse-soft_3s_infinite_ease-in-out] overflow-hidden" data-next-screen="main-site" onclick="window.location.href='#next'" title="Go to main site">
<!-- Glassmorphism Shine Effect -->
<span class="absolute inset-0 w-full h-full bg-gradient-to-tr from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></span>
<span class="relative z-10">Enter Our World</span>
<span class="relative z-10 material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
<p class="mt-8 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest opacity-60">
                    A Heartfelt Dates Journey
                </p>
</div>
</div>
<!-- Bottom Branding Anchor (Minimal) -->
<div class="absolute bottom-10 left-0 right-0 flex justify-center opacity-40">
<span class="font-headline-md text-label-sm text-primary font-bold italic">Heartfelt Dates</span>
</div>
</main>
<!-- Interactive Script for Floating Accents -->
<script>
        const container = document.getElementById('sparkle-container');
        const icons = ['sparkles', 'favorite', 'auto_awesome', 'favorite'];
        
        function createSparkle() {
            const sparkle = document.createElement('span');
            sparkle.className = 'material-symbols-outlined sparkle';
            sparkle.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // Random Positioning
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const size = 12 + Math.random() * 24;
            const delay = Math.random() * 5;
            const duration = 3 + Math.random() * 4;
            
            sparkle.style.left = `${posX}%`;
            sparkle.style.top = `${posY}%`;
            sparkle.style.fontSize = `${size}px`;
            sparkle.style.animationDelay = `${delay}s`;
            sparkle.style.animationDuration = `${duration}s`;
            
            // Random variation setting for weight
            sparkle.style.fontVariationSettings = `'FILL' ${Math.random() > 0.5 ? 1 : 0}`;
            
            // Random color from palette
            const colors = ['#b90760', '#ff4d94', '#e17350', '#feb700'];
            sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];

            container.appendChild(sparkle);

            // Cleanup
            setTimeout(() => {
                sparkle.remove();
            }, (delay + duration) * 1000);
        }

        // Initial burst
        for(let i = 0; i < 15; i++) {
            createSparkle();
        }

        // Constant trickle
        setInterval(createSparkle, 800);

        // Interaction Sparkle (Mouse move)
        let lastMove = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove > 100) {
                const sparkle = document.createElement('span');
                sparkle.className = 'material-symbols-outlined sparkle';
                sparkle.innerText = 'auto_awesome';
                sparkle.style.left = `${e.clientX}px`;
                sparkle.style.top = `${e.clientY}px`;
                sparkle.style.fontSize = '14px';
                sparkle.style.color = '#ffb1c7';
                sparkle.style.position = 'fixed';
                sparkle.style.animation = 'float 2s forwards';
                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 2000);
                lastMove = now;
            }
        });
    </script>
</body></html>
